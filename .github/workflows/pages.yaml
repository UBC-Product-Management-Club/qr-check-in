name: Deploy staging to GitHub Pages

# A second staging site that needs no Google Cloud credentials:
# https://ubc-product-management-club.github.io/qr-check-in/
# It uses the same Supabase secrets as the staging environment.
on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        environment: staging

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Create env file
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_PUBLIC_KEY: ${{ secrets.SUPABASE_PUBLIC_KEY }}
              run: |
                  if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLIC_KEY" ]; then
                      echo "SUPABASE_URL and SUPABASE_PUBLIC_KEY must be set as secrets on the staging environment"
                      exit 1
                  fi
                  mkdir .secret
                  echo "VITE_SUPABASE_URL=$SUPABASE_URL" >> .secret/.env
                  echo "VITE_SUPABASE_PUBLIC_KEY=$SUPABASE_PUBLIC_KEY" >> .secret/.env

            - name: Install dependencies
              run: npm ci

            - name: Build
              env:
                  BASE_PATH: /qr-check-in/
              # Pages has no rewrite rules, so 404.html serves the app for deep links like /scan
              run: |
                  npm run build
                  cp dist/index.html dist/404.html

            - name: Upload site
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        name: Deploy
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
